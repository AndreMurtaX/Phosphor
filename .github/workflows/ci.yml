# THE THIRD MACHINE (2026-10-09). The two development machines are a Windows
# desktop and a Linux that lives on it; this runs every runner on a clean
# Ubuntu nobody configured by hand. It exists because the Linux VM could not
# judge anything timed: VirtualBox there runs on the Windows hypervisor
# ("fall back to NEM: VT-x is not available" in its own log), and a process
# sleeping 10 ms woke 2633 ms late -- the committed HEAD failed its own timing
# tests on it. See docs/dev-agent-playbook.md, the 2026-10-08 sweep entry.
#
# The toolchain is the one the development machines use, byte for byte: the
# official Lazarus 4.8 packages (FPC 3.2.2), checked against the SHA-256 of the
# copies installed there -- NOT the distribution's lazarus, which is 3.0.
#
# A SKIP here is a FAILURE. On a developer's machine a missing library is
# skipped with a yellow line; on the one machine whose whole job is to run
# everything, a skip means the job did not do its job. The one exception is a
# case that cannot exist on Linux at all, named below.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain -- Lazarus 4.8 and FPC 3.2.2, the development machines' packages
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q python3 openssl libsqlite3-0 sqlite3 xvfb xauth \
            x11-utils libgtk2.0-dev libx11-dev
          base='https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8'
          mkdir -p "$RUNNER_TEMP/debs"
          cd "$RUNNER_TEMP/debs"
          for f in fpc-laz_3.2.2-210709_amd64.deb fpc-src_3.2.2-210709_amd64.deb \
                   lazarus-project_4.8.0-0_amd64.deb; do
            curl -fsSL --retry 5 --retry-delay 10 -o "$f" "$base/$f/download"
          done
          printf '%s\n' \
            '92000f2b831184e153aab0c910f8ae9240450e5c6d76dc189cf53116ee501d83  fpc-laz_3.2.2-210709_amd64.deb' \
            '8c9e145d8056754a9ca39ce3e52e982b8e4816124984c5f542f2a874e721ad53  fpc-src_3.2.2-210709_amd64.deb' \
            '401742cefb01ad99a628188034bf728fb5360d641ed2be5f91fb0ee183a301cd  lazarus-project_4.8.0-0_amd64.deb' \
            > SHA256SUMS
          sha256sum -c SHA256SUMS
          sudo apt-get install -y -q ./fpc-laz_3.2.2-210709_amd64.deb \
            ./fpc-src_3.2.2-210709_amd64.deb ./lazarus-project_4.8.0-0_amd64.deb
          fpc -iV

      # Each runner's exit code is captured on its own line: `$?` after a pipe
      # measures the pipe (CLAUDE.md, "An exit code answers the question the
      # tool asked").
      - name: build
        run: |
          bash scripts/build.sh 2>&1 | tee ci-build.log
          exit "${PIPESTATUS[0]}"
      - name: test-suite
        if: success() || failure()
        run: |
          bash scripts/test-suite.sh 2>&1 | tee ci-test-suite.log
          exit "${PIPESTATUS[0]}"
      - name: test-suite -ProveFailure
        if: success() || failure()
        run: |
          bash scripts/test-suite.sh -ProveFailure 2>&1 | tee ci-prove.log
          exit "${PIPESTATUS[0]}"
      - name: test-classic
        if: success() || failure()
        run: |
          bash scripts/test-classic.sh 2>&1 | tee ci-test-classic.log
          exit "${PIPESTATUS[0]}"
      - name: test-examples
        if: success() || failure()
        run: |
          bash scripts/test-examples.sh 2>&1 | tee ci-test-examples.log
          exit "${PIPESTATUS[0]}"
      - name: test-packages
        if: success() || failure()
        run: |
          bash scripts/test-packages.sh 2>&1 | tee ci-test-packages.log
          exit "${PIPESTATUS[0]}"
      - name: test-gui (under Xvfb)
        if: success() || failure()
        run: |
          xvfb-run -a bash scripts/test-gui.sh 2>&1 | tee ci-test-gui.log
          exit "${PIPESTATUS[0]}"
      - name: test
        if: success() || failure()
        run: |
          xvfb-run -a bash scripts/test.sh 2>&1 | tee ci-test.log
          exit "${PIPESTATUS[0]}"

      - name: nothing was skipped
        if: success() || failure()
        run: |
          # The only case allowed to skip: it tests a Windows console behaviour.
          # Matched after grep -H's `file:` prefix -- a `^` here sat in the
          # middle of the pattern, matched nothing, and the first CI run failed
          # on the one skip this line exists to allow.
          allowed=':SKIP  V:a re-shown console \(Windows only'
          if grep -HE '^SKIP|SKIPPED' ci-*.log | grep -vE "$allowed"; then
            echo "FAIL  a runner skipped work on the machine that exists to run all of it"
            exit 1
          fi
          echo "PASS  nothing skipped but the Windows-only case"

      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs
          path: ci-*.log

  # THE WINDOWS TWIN (2026-10-09). Until this job the Windows half of "green on
  # both machines" was one desktop, whose OpenSSL came from Laragon's PHP and
  # whose SQLite came from Embarcadero's directory -- by PATH, written down
  # nowhere. Here every runtime library has a named source and a checked hash:
  # the official Lazarus 4.8 installer (FPC 3.2.2, the desktop's version; MD5 as
  # SourceForge publishes it), SQLite's own Windows DLL (SHA3-256 as sqlite.org
  # publishes it), and OpenSSL 3 from Git for Windows on the image, copied by
  # name and refused if absent. And no runner may SKIP here: nothing in the
  # suite is Linux-only, so a skip on Windows means a library went missing.
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain -- Lazarus 4.8 and FPC 3.2.2, the desktop's version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe/download'
          $exe = Join-Path $env:RUNNER_TEMP 'lazarus-4.8-fpc-3.2.2-win64.exe'
          curl.exe -fsSL --retry 5 --retry-delay 10 -o $exe $url
          $md5 = (Get-FileHash -Algorithm MD5 $exe).Hash.ToLower()
          if ($md5 -ne 'eb7e75999b6370d4ef9bba1ac407d6c9') { throw "lazarus installer MD5 $md5 is not the published one" }
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\lazarus'
          & C:\lazarus\fpc\3.2.2\bin\x86_64-win64\fpc.exe -iV

      - name: Runtime libraries -- SQLite and OpenSSL 3, from named sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlls = Join-Path $env:RUNNER_TEMP 'dlls'
          New-Item -ItemType Directory -Force $dlls | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'sqlite.zip'
          curl.exe -fsSL --retry 5 --retry-delay 10 -o $zip 'https://www.sqlite.org/2026/sqlite-dll-win-x64-3540000.zip'
          $sha3 = python -c "import hashlib,sys; print(hashlib.sha3_256(open(sys.argv[1],'rb').read()).hexdigest())" $zip
          if ($sha3 -ne 'f5fb500c73a3afd89976386bb8e4fdc8b5b65c052e187fb1ada1f5de034cd45b') { throw "sqlite zip SHA3-256 $sha3 is not the published one" }
          Expand-Archive $zip -DestinationPath $dlls
          $git = 'C:\Program Files\Git\mingw64\bin'
          foreach ($n in 'libssl-3-x64.dll', 'libcrypto-3-x64.dll') {
            $src = Join-Path $git $n
            if (-not (Test-Path $src)) { throw "$n is not in $git on this image" }
            Copy-Item $src $dlls
          }
          Get-ChildItem $dlls | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          # The libraries are found by PATH, as on the desktop -- but this is the
          # only directory on it that holds them, and it is named here.
          Add-Content $env:GITHUB_PATH $dlls

      # Each runner under Windows PowerShell 5.1, as on the desktop, with its own
      # exit code -- not a pipeline's.
      - name: build
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\build.ps1 *>&1 | Tee-Object ci-build.log
          exit $LASTEXITCODE
      - name: test-suite
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test-suite.ps1 *>&1 | Tee-Object ci-test-suite.log
          exit $LASTEXITCODE
      - name: test-suite -ProveFailure
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test-suite.ps1 -ProveFailure *>&1 | Tee-Object ci-prove.log
          exit $LASTEXITCODE
      - name: test-classic
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test-classic.ps1 *>&1 | Tee-Object ci-test-classic.log
          exit $LASTEXITCODE
      - name: test-examples
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test-examples.ps1 *>&1 | Tee-Object ci-test-examples.log
          exit $LASTEXITCODE
      - name: test-packages
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test-packages.ps1 *>&1 | Tee-Object ci-test-packages.log
          exit $LASTEXITCODE
      - name: test-gui
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test-gui.ps1 *>&1 | Tee-Object ci-test-gui.log
          exit $LASTEXITCODE
      - name: test
        if: success() || failure()
        shell: pwsh
        run: |
          powershell -NoProfile -File scripts\test.ps1 *>&1 | Tee-Object ci-test.log
          exit $LASTEXITCODE

      - name: nothing was skipped
        if: success() || failure()
        shell: pwsh
        run: |
          $skips = Select-String -Path ci-*.log -Pattern '^SKIP|SKIPPED'
          if ($skips) {
            $skips | ForEach-Object { Write-Host $_ }
            Write-Host 'FAIL  a runner skipped work on Windows, where nothing is platform-only'
            exit 1
          }
          Write-Host 'PASS  nothing skipped'

      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: ci-*.log
